apiVersion: v1
kind: Pod
metadata:
  name: crash-demo
  namespace: foundation
spec:
  automountServiceAccountToken: false
  containers:
    - name: crash-demo
      image: busybox:1.37.0
      command: [sh, -c, "echo 'intentional startup error' >&2; exit 1"]
      resources:
        requests:
          cpu: 10m
          memory: 8Mi
        limits:
          cpu: 100m
          memory: 32Mi
