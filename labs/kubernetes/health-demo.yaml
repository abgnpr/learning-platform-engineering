apiVersion: v1
kind: Pod
metadata:
  name: health-demo
  namespace: foundation
  labels:
    app: health-demo
spec:
  automountServiceAccountToken: false
  containers:
    - name: health-demo
      image: nginx:alpine
      command: [sh, -c, "touch /tmp/ready /tmp/live; exec nginx -g 'daemon off;'"]
      ports:
        - name: http
          containerPort: 80
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
      startupProbe:
        httpGet:
          path: /
          port: http
        periodSeconds: 1
        failureThreshold: 30
      readinessProbe:
        exec:
          command: [test, -f, /tmp/ready]
        periodSeconds: 2
        failureThreshold: 1
      livenessProbe:
        exec:
          command: [test, -f, /tmp/live]
        periodSeconds: 2
        failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: health-demo
  namespace: foundation
spec:
  selector:
    app: health-demo
  ports:
    - name: http
      port: 8080
      targetPort: http
