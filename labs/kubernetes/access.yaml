apiVersion: v1
kind: ServiceAccount
metadata:
  name: config-reader
  namespace: foundation
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: config-reader
  namespace: foundation
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: config-reader
  namespace: foundation
subjects:
  - kind: ServiceAccount
    name: config-reader
    namespace: foundation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: config-reader
