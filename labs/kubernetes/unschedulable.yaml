apiVersion: v1
kind: Pod
metadata:
  name: too-large
  namespace: foundation
spec:
  automountServiceAccountToken: false
  containers:
    - name: sleeper
      image: busybox:1.37.0
      command: [sleep, "3600"]
      resources:
        requests:
          cpu: "1000"
          memory: 8Mi
        limits:
          cpu: "1000"
          memory: 32Mi
